name: Build HK Weather Radar APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載儲存庫程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Java 17 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 安裝最新穩定版 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. 自動生成 Android 專案結構、加入套件與網絡權限
        run: |
          # 兼容兩種擺放位置：不論你把檔案命名為 lib/main.dart 或 hk_weather_radar_main.dart 都能自動識別
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/user_main.dart
          elif [ -f "hk_weather_radar_main.dart" ]; then
            cp hk_weather_radar_main.dart /tmp/user_main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart /tmp/user_main.dart
          else
            echo "找不到 main.dart 或 hk_weather_radar_main.dart，請確認已上傳程式碼檔案！"
            exit 1
          fi

          # 建立標準 Flutter Android 專案結構
          flutter create --platforms=android --org hk.weather.radar --project-name hk_weather_radar .
          cp /tmp/user_main.dart lib/main.dart

          # 自動安裝氣象雷達與圖表所需套件
          flutter pub add http flutter_map latlong2 fl_chart

          # 自動在 AndroidManifest.xml 補上 INTERNET 網絡權限 (避免實機安裝後無法連線 API)
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: 5. 編譯 Android Release APK
        run: flutter build apk --release

      - name: 6. 上傳 APK 至 Actions Artifacts 備份
        uses: actions/upload-artifact@v4
        with:
          name: hk-weather-radar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 7. 自動發佈至 GitHub Releases (手機可直接點擊下載 .apk，免解壓 ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "香港及亞太氣象雷達 App v1.0.${{ github.run_number }}"
          body: "📱 **手機直接安裝說明**：請點擊下方 Assets 區塊中的 `app-release.apk` 下載並安裝至 Android 手機。"
          files: build/app/outputs/flutter-apk/app-release.apk

